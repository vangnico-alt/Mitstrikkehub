<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4f0">
  <title>Mit Strikkehjørne</title>
  <style>
:root {
  --bg:#f8f4f0;
  --paper:#fffdfa;
  --ink:#30282d;
  --muted:#786e70;
  --line:#e8dedb;
  --accent:#a76f86;
  --accent2:#806957;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.shell {
  max-width:850px;
  margin:auto;
  padding:20px 14px 40px;
}

.hero {
  padding:25px 20px 22px;
  background:#f0e5e6;
  border:1px solid #e7d8dd;
  border-radius:24px;
  margin-bottom:14px;
}

.eyebrow {
  text-transform:uppercase;
  letter-spacing:.15em;
  font-size:11px;
  color:var(--muted);
}

h1 {
  font:500 34px/1.1 Georgia,serif;
  margin:8px 0;
}

p {
  margin:5px 0;
  color:#655b5f;
}

.tabs {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:14px 0;
}

.tab {
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px 12px;
  background:var(--paper);
  color:var(--ink);
  text-align:left;
  font:inherit;
  cursor:pointer;
}

.tab strong {
  display:block;
  font-size:16px;
}

.tab span {
  font-size:12px;
  color:var(--muted);
}

.tab.active {
  background:#fff;
  border-color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent);
}

.tab[data-project="bea"].active {
  border-color:var(--accent2);
  box-shadow:inset 0 0 0 1px var(--accent2);
}

.framewrap {
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:white;
  min-height:620px;
}

iframe {
  display:block;
  width:100%;
  height:1100px;
  border:0;
  background:white;
}

.foot {
  font-size:12px;
  color:var(--muted);
  text-align:center;
  padding:16px 5px 0;
}

.hidden {
  display:none;
}

@media(min-width:700px) {
  .shell{padding-top:28px
}

.hero {
  padding:30px;
}

.tabs {
  max-width:580px;
}

.framewrap {
  min-height:750px;
}

iframe {
  height:1200px;
}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">Dit personlige strikkeprojekt</div>
      <h1>Mit Strikkehjørne</h1>
      <p>Alle dine opskrifter og din fremgang samlet ét sted.</p>
    </header>

    <nav class="tabs" aria-label="Vælg strikkeprojekt">
      <button class="tab active" data-project="sophie" aria-pressed="true">
        <strong>🧣 Sophie Scarf</strong>
        <span>Pind-for-pind tracker</span>
      </button>
      <button class="tab" data-project="bea" aria-pressed="false">
        <strong>🧶 Bea Top</strong>
        <span>Størrelse og trinvis guide</span>
      </button>
    </nav>

    <section class="framewrap">
      <iframe id="project" title="Strikkeguide" loading="eager"></iframe>
    </section>
    <div class="foot">
      Fremgang gemmes lokalt i browseren på denne enhed. Brug Sophie Scarf-statuskoden eller Bea Top-backup til at flytte din status.
    </div>
  </main>

    const frame = document.getElementById('project');
    let activeProject = 'sophie';

    function decodePage(encodedPage) {
      const cleanBase64 = encodedPage.replace(/\s/g, '');
      return decodeURIComponent(escape(atob(cleanBase64)));
    }

    function openProject(projectName) {
      activeProject = projectName;
      frame.srcdoc = decodePage(pages[projectName]);
      frame.title = projectName === 'sophie'
        ? 'Sophie Scarf pindetracker'
        : 'Bea Top strikketracker';

      document.querySelectorAll('.tab').forEach((button) => {
        const isActive = button.dataset.project === projectName;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
    }

    document.querySelectorAll('.tab').forEach((button) => {
      button.addEventListener('click', () => {
        if (button.dataset.project !== activeProject) {
          openProject(button.dataset.project);
        }
      });
    });

    openProject('sophie');
  </script>
